# SPDX-License-Identifier: MIT
# Builds everything the guest needs and packs it into the installer (vgd-setup-<version>.exe), as README's build
# steps do. A tag v<x.y.z> also publishes it as a release; the tag has to match the project's VERSION
# (CMakeLists.txt), to which the build appends the commit count.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # the release

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # the commit count is part of the version

      - uses: cachix/install-nix-action@v31

      - name: Cache the WDK and SDK headers
        uses: actions/cache@v4
        with:
          path: refs/winkits
          key: winkits-${{ hashFiles('cmake/fetch-winkits.sh') }}

      - name: Fetch the WDK and SDK headers
        run: cmake/fetch-winkits.sh

      - name: Prepare the dev shell
        run: nix develop -c true

      - name: Build the Venus ICD and the OpenGL driver
        run: nix develop -c icd/build.sh

      # The kernel takes any signature in test mode: a throwaway certificate per build.
      - name: Build the KMD
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=vgd CI test signing" \
            -addext extendedKeyUsage=codeSigning -keyout "$RUNNER_TEMP/kmd.key" -out "$RUNNER_TEMP/kmd.crt"
          openssl pkcs12 -export -passout pass: -inkey "$RUNNER_TEMP/kmd.key" -in "$RUNNER_TEMP/kmd.crt" \
            -out "$RUNNER_TEMP/kmd.pfx"
          nix develop -c sh -c "cmake -S kmd -B build/kmd -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/clang-cl-kmd.cmake \
            -DVGD_KMD_SIGN_PFX=$RUNNER_TEMP/kmd.pfx && ninja -C build/kmd"

      - name: Build the UMDs, the services and the installer
        run: |
          nix develop -c sh -c "cmake -S . -B build/win -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake && \
            cmake --build build/win"
          version=$(cat build/win/setup/version.txt)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cp build/win/setup/vgd-setup.exe "vgd-setup-$version.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: vgd-setup-${{ env.VERSION }}
          path: vgd-setup-${{ env.VERSION }}.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in "${GITHUB_REF_NAME#v}".*) ;; *)
            echo "Tag $GITHUB_REF_NAME does not match the version $VERSION"; exit 1 ;; esac
          gh release create "$GITHUB_REF_NAME" "vgd-setup-$VERSION.exe" --title "vgd $VERSION" --generate-notes
